<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" width="100%" height="100%">
    <defs>
        <style>
            .lane-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
            .node-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
            .node-sub { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 8px; fill: #475569; text-anchor: middle; }
            .edge-label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 8px; font-weight: bold; fill: #008767; }
            .legend-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 9px; fill: #334155; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#008767" />
        </marker>
        <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c" />
        </marker>
    </defs>

    <!-- Background -->
    <rect width="900" height="820" fill="#ffffff" rx="8" />

    <!-- Swimlane Column Headers -->
    <!-- Lane 1: Admin HR & User -->
    <rect x="10" y="10" width="120" height="30" fill="#0f172a" rx="4" />
    <text x="70" y="29" class="lane-title">1. HR & USER</text>
    <rect x="10" y="45" width="120" height="725" fill="#f8fafc" stroke="#e2e8f0" rx="4" />

    <!-- Lane 2: Manager & Kadiv -->
    <rect x="135" y="10" width="125" height="30" fill="#008767" rx="4" />
    <text x="197" y="29" class="lane-title">2. MGR & KADIV</text>
    <rect x="135" y="45" width="125" height="725" fill="#f0fdf4" stroke="#dcfce7" rx="4" />

    <!-- Lane 3: IT & GA Survey -->
    <rect x="265" y="10" width="125" height="30" fill="#0284c7" rx="4" />
    <text x="327" y="29" class="lane-title">3. IT & GA SURVEY</text>
    <rect x="265" y="45" width="125" height="725" fill="#f0f9ff" stroke="#e0f2fe" rx="4" />

    <!-- Lane 4: Budget Control -->
    <rect x="395" y="10" width="125" height="30" fill="#d97706" rx="4" />
    <text x="457" y="29" class="lane-title">4. BUDGETING</text>
    <rect x="395" y="45" width="125" height="725" fill="#fffbe6" stroke="#fef08a" rx="4" />

    <!-- Lane 5: Kadiv Ops & GA -->
    <rect x="525" y="10" width="125" height="30" fill="#4f46e5" rx="4" />
    <text x="587" y="29" class="lane-title">5. KADIV OPS & GA</text>
    <rect x="525" y="45" width="125" height="725" fill="#eeef2" stroke="#e0e7ff" rx="4" />

    <!-- Lane 6: Direksi -->
    <rect x="655" y="10" width="115" height="30" fill="#7c3aed" rx="4" />
    <text x="712" y="29" class="lane-title">6. DIREKSI</text>
    <rect x="655" y="45" width="115" height="725" fill="#f5f3ff" stroke="#ddd6fe" rx="4" />

    <!-- Lane 7: Finance -->
    <rect x="775" y="10" width="115" height="30" fill="#059669" rx="4" />
    <text x="832" y="29" class="lane-title">7. FINANCE</text>
    <rect x="775" y="45" width="115" height="725" fill="#ecfdf5" stroke="#a7f3d0" rx="4" />

    <!-- ================= SWIMLANE NODES & FLOWS ================= -->

    <!-- Start Event -->
    <circle cx="70" cy="75" r="16" fill="#22c55e" stroke="#15803d" stroke-width="2" />
    <text x="70" y="79" font-size="8px" font-weight="bold" fill="#ffffff" text-anchor="middle">MULAI</text>

    <!-- Node 1: Input Delegasi Cuti / Sakit -->
    <rect x="20" y="110" width="100" height="42" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" rx="6" />
    <text x="70" y="126" class="node-title">Form Delegasi Plt</text>
    <text x="70" y="138" class="node-sub">(Self / HR Sakit)</text>

    <!-- Connection Start to Delegasi -->
    <line x1="70" y1="91" x2="70" y2="110" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Node 2: Input Pengajuan Barang -->
    <rect x="20" y="180" width="100" height="42" fill="#ffffff" stroke="#008767" stroke-width="1.5" rx="6" />
    <text x="70" y="196" class="node-title">Buat Pengajuan</text>
    <text x="70" y="208" class="node-sub">Item &amp; Est. Harga</text>

    <line x1="70" y1="152" x2="70" y2="180" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Flow to Lane 2 (Manager) -->
    <path d="M 120 201 L 145 201" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

    <!-- Node 3: Manager Decision (Lane 2) -->
    <polygon points="197,180 237,201 197,222 157,201" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
    <text x="197" y="204" font-size="7.5px" font-weight="bold" fill="#c2410c" text-anchor="middle">Mgr Cuti?</text>

    <!-- Normal Mgr -->
    <rect x="152" y="240" width="90" height="36" fill="#ffffff" stroke="#008767" stroke-width="1.5" rx="5" />
    <text x="197" y="255" class="node-title">Approve Mgr</text>
    <text x="197" y="266" class="node-sub">(Manager Utama)</text>

    <!-- Plt Mgr -->
    <rect x="152" y="295" width="90" height="36" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" rx="5" />
    <text x="197" y="310" class="node-title">Approve Plt Mgr</text>
    <text x="197" y="321" class="node-sub">(Plt 1 Divisi)</text>

    <line x1="197" y1="222" x2="197" y2="240" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="202" y="233" class="edge-label">Tidak</text>

    <path d="M 237 201 L 250 201 L 250 313 L 242 313" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)" fill="none" />
    <text x="240" y="196" class="edge-label" fill="#ea580c">Ya (Cuti)</text>

    <!-- Flow to Kadiv Decision -->
    <polygon points="197,355 237,375 197,395 157,375" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
    <text x="197" y="378" font-size="7.5px" font-weight="bold" fill="#c2410c" text-anchor="middle">Kadiv Cuti?</text>

    <line x1="197" y1="276" x2="197" y2="355" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="197" y1="331" x2="197" y2="355" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Plt Kadiv -->
    <rect x="152" y="415" width="90" height="36" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" rx="5" />
    <text x="197" y="430" class="node-title">Approve Plt Kadiv</text>
    <text x="197" y="441" class="node-sub">(Plt 1 Divisi)</text>

    <path d="M 237 375 L 250 375 L 250 433 L 242 433" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)" fill="none" />
    <text x="240" y="370" class="edge-label" fill="#ea580c">Ya (Cuti)</text>

    <!-- Flow to Lane 3 (IT & GA Survey) -->
    <path d="M 197 451 L 197 470 L 275 470" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
    <path d="M 157 375 L 140 375 L 140 470 L 275 470" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

    <!-- Node 4: GA Survey (Lane 3) -->
    <polygon points="327,450 367,470 327,490 287,470" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
    <text x="327" y="473" font-size="7.5px" font-weight="bold" fill="#c2410c" text-anchor="middle">GA Cuti/Sakit?</text>

    <rect x="282" y="510" width="90" height="36" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" rx="5" />
    <text x="327" y="525" class="node-title">Survei 3 Vendor</text>
    <text x="327" y="536" class="node-sub">(Petugas GA Utama)</text>

    <rect x="282" y="560" width="90" height="36" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" rx="5" />
    <text x="327" y="575" class="node-title">Survei Plt GA</text>
    <text x="327" y="586" class="node-sub">(Plt Tim GA)</text>

    <line x1="327" y1="490" x2="327" y2="510" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 367 470 L 380 470 L 380 578 L 372 578" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)" fill="none" />
    <text x="370" y="465" class="edge-label" fill="#ea580c">Ya (Sakit)</text>

    <!-- Flow to Lane 4 (Budgeting) -->
    <path d="M 327 546 L 327 610 L 405 610" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
    <path d="M 327 596 L 327 610 L 405 610" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

    <!-- Node 5: Budgeting (Lane 4) -->
    <polygon points="457,590 497,610 457,630 417,610" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
    <text x="457" y="613" font-size="7px" font-weight="bold" fill="#c2410c" text-anchor="middle">Budget Cuti?</text>

    <rect x="412" y="645" width="90" height="36" fill="#ffffff" stroke="#d97706" stroke-width="1.5" rx="5" />
    <text x="457" y="660" class="node-title">Budget Control</text>
    <text x="457" y="671" class="node-sub">(Tim Budgeting)</text>

    <rect x="412" y="695" width="90" height="36" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" rx="5" />
    <text x="457" y="710" class="node-title">Plt Budgeting</text>
    <text x="457" y="721" class="node-sub">(Plt Budgeting)</text>

    <line x1="457" y1="630" x2="457" y2="645" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 497 610 L 510 610 L 510 713 L 502 713" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)" fill="none" />

    <!-- Flow to Lane 5 & 6 (Kadiv Ops & Direksi) -->
    <path d="M 457 681 L 457 745 L 665 745" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
    <path d="M 457 731 L 457 745 L 665 745" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

    <!-- Node 6: Direksi (Lane 6) -->
    <polygon points="712,725 747,745 712,765 677,745" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
    <text x="712" y="748" font-size="7px" font-weight="bold" fill="#c2410c" text-anchor="middle">Direktur Cuti?</text>

    <!-- Flow to Lane 7 (Finance) -->
    <path d="M 747 745 L 785 745" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

    <!-- Node 7: Finance (Lane 7) -->
    <rect x="785" y="725" width="95" height="40" fill="#dc2626" stroke="#991b1b" stroke-width="1.5" rx="6" />
    <text x="832" y="742" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9px" font-weight="bold" fill="#ffffff" text-anchor="middle">Pencairan Dana</text>
    <text x="832" y="754" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="7.5px" fill="#fecaca" text-anchor="middle">(Plt / Kasir)</text>

    <!-- End Event -->
    <circle cx="832" cy="790" r="14" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
    <text x="832" y="794" font-size="7.5px" font-weight="bold" fill="#ffffff" text-anchor="middle">SELESAI</text>
    <line x1="832" y1="765" x2="832" y2="776" stroke="#008767" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Legend Box -->
    <rect x="20" y="775" width="460" height="35" fill="#ffffff" stroke="#cbd5e1" rx="4" />
    <rect x="30" y="787" width="12" height="12" fill="#ffffff" stroke="#008767" stroke-width="1.5" rx="2" />
    <text x="48" y="797" class="legend-text">Alur Normal / Pejabat Hadir</text>
    <rect x="180" y="787" width="12" height="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" rx="2" />
    <text x="198" y="797" class="legend-text">Alur Delegasi Plt (Pejabat Cuti / Sakit Mendadak)</text>
</svg>
