<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" width="100%" height="100%">
    <defs>
        <style>
            .act-header { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
            .act-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
            .act-sub { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 8px; fill: #475569; text-anchor: middle; }
            .act-label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: bold; fill: #008767; }
        </style>
        <marker id="act-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#008767" />
        </marker>
        <marker id="act-arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
        </marker>
    </defs>

    <rect width="750" height="480" fill="#ffffff" rx="8" />

    <text x="375" y="25" class="act-header">ACTIVITY DIAGRAM: DECISION LOGIC PENGECEKAN HAK AKSES PLT & DELEGASI</text>
    <line x1="40" y1="35" x2="710" y2="35" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Start Circle -->
    <circle cx="375" cy="65" r="14" fill="#008767" />
    <text x="375" y="69" font-family="sans-serif" font-size="8px" font-weight="bold" fill="#ffffff" text-anchor="middle">MULAI</text>

    <!-- Node 1: User Akses Halaman -->
    <rect x="290" y="95" width="170" height="38" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" rx="6" />
    <text x="375" y="111" class="act-title">User Akses Halaman Persetujuan</text>
    <text x="375" y="123" class="act-sub">(Manager/Kadiv/IT/GA/Budget/Direksi)</text>
    <line x1="375" y1="79" x2="375" y2="95" stroke="#008767" stroke-width="1.5" marker-end="url(#act-arrow)" />

    <!-- Decision 1: Has Direct Role? -->
    <polygon points="375,155 450,180 375,205 300,180" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="375" y="183" font-size="8.5px" font-weight="bold" fill="#15803d" text-anchor="middle">User Punya Role Asli?</text>
    <line x1="375" y1="133" x2="375" y2="155" stroke="#008767" stroke-width="1.5" marker-end="url(#act-arrow)" />

    <!-- Direct Role Branch (RIGHT) -->
    <rect x="520" y="161" width="160" height="38" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" rx="6" />
    <text x="600" y="177" class="act-title" fill="#14532d">Akses Diberikan (Role Utama)</text>
    <text x="600" y="189" class="act-sub">Tampilkan Data Pengajuan Divisi</text>
    <line x1="450" y1="180" x2="520" y2="180" stroke="#008767" stroke-width="1.5" marker-end="url(#act-arrow)" />
    <text x="470" y="174" class="act-label">Ya (Punya Role)</text>

    <!-- No Direct Role Branch (DOWN) -->
    <line x1="375" y1="205" x2="375" y2="235" stroke="#008767" stroke-width="1.5" marker-end="url(#act-arrow)" />
    <text x="382" y="222" class="act-label">Tidak</text>

    <!-- Node 2: Check Delegasi Database -->
    <rect x="270" y="235" width="210" height="42" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" rx="6" />
    <text x="375" y="252" class="act-title" fill="#c2410c">Sistem Cek Tabel delegasi_approvals</text>
    <text x="375" y="265" class="act-sub">Filter: is_active=true &amp; now() di rentang tgl</text>

    <!-- Decision 2: Active Delegation Exists? -->
    <polygon points="375,300 460,325 375,350 290,325" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
    <text x="375" y="328" font-size="8px" font-weight="bold" fill="#c2410c" text-anchor="middle">Ada Delegasi Aktif (1 Divisi)?</text>
    <line x1="375" y1="277" x2="375" y2="300" stroke="#008767" stroke-width="1.5" marker-end="url(#act-arrow)" />

    <!-- Delegation Success (RIGHT) -->
    <rect x="520" y="306" width="160" height="38" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" rx="6" />
    <text x="600" y="322" class="act-title" fill="#9a3412">Akses Diberikan (Hak Plt)</text>
    <text x="600" y="334" class="act-sub">Badge: [Plt: Nama Pejabat]</text>
    <line x1="460" y1="325" x2="520" y2="325" stroke="#008767" stroke-width="1.5" marker-end="url(#act-arrow)" />
    <text x="475" y="319" class="act-label" fill="#ea580c">Ya (Ada Plt)</text>

    <!-- Delegation Denied (LEFT) -->
    <rect x="70" y="306" width="160" height="38" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="6" />
    <text x="150" y="322" class="act-title" fill="#991b1b">Akses Ditolak (403)</text>
    <text x="150" y="334" class="act-sub">Menu Tidak Ditampilkan</text>
    <line x1="290" y1="325" x2="230" y2="325" stroke="#dc2626" stroke-width="1.5" marker-end="url(#act-arrow-red)" />
    <text x="245" y="319" font-size="8.5px" font-weight="bold" fill="#dc2626">Tidak</text>

    <!-- Merge End -->
    <circle cx="600" cy="420" r="14" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
    <text x="600" y="424" font-size="7.5px" font-weight="bold" fill="#ffffff" text-anchor="middle">SELESAI</text>

    <line x1="600" y1="199" x2="600" y2="406" stroke="#008767" stroke-width="1.5" marker-end="url(#act-arrow)" />
    <line x1="600" y1="344" x2="600" y2="406" stroke="#008767" stroke-width="1.5" marker-end="url(#act-arrow)" />
</svg>
